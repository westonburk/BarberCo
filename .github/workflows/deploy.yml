name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:   # the manual "one click" button

permissions:
  contents: read
  packages: write       # push images to GHCR

env:
  REGISTRY: ghcr.io/westonburk

jobs:
  # 1) Read declared versions and decide what needs building
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      any: ${{ steps.set.outputs.any }}
      changed: ${{ steps.set.outputs.changed }}
      api_build: ${{ steps.set.outputs.api_build }}
      web_version: ${{ steps.set.outputs.web_version }}
      api_version: ${{ steps.set.outputs.api_version }}
      mgmt_version: ${{ steps.set.outputs.mgmt_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - id: set
        run: |
          set -euo pipefail
          WEB_VERSION=$(jq -r .version barberco-web/package.json)
          API_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' BarberCo.Api/BarberCo.Api.csproj)
          MGMT_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' BarberCo.Management/BarberCo.Management.csproj)

          exists() { docker manifest inspect "$1" >/dev/null 2>&1; }

          INCLUDE=""
          CHANGED=""
          add() { # name image version context dockerfile
            [ -n "$INCLUDE" ] && INCLUDE="$INCLUDE,"
            INCLUDE="$INCLUDE{\"service\":\"$1\",\"image\":\"$2\",\"version\":\"$3\",\"context\":\"$4\",\"dockerfile\":\"$5\"}"
            CHANGED="$CHANGED $1"
          }

          exists "$REGISTRY/barberco-web:$WEB_VERSION"        || add web        "$REGISTRY/barberco-web"        "$WEB_VERSION"  "barberco-web" "barberco-web/Dockerfile"
          exists "$REGISTRY/barberco:$API_VERSION"            || add api        "$REGISTRY/barberco"            "$API_VERSION"  "."            "BarberCo.Api/Dockerfile"
          exists "$REGISTRY/barberco-management:$MGMT_VERSION" || add management "$REGISTRY/barberco-management" "$MGMT_VERSION" "."            "BarberCo.Management/Dockerfile"

          API_BUILD=false; echo "$CHANGED" | grep -qw api && API_BUILD=true

          {
            echo "matrix={\"include\":[$INCLUDE]}"
            echo "any=$([ -n "$INCLUDE" ] && echo true || echo false)"
            echo "changed=$(echo $CHANGED | xargs)"
            echo "api_build=$API_BUILD"
            echo "web_version=$WEB_VERSION"
            echo "api_version=$API_VERSION"
            echo "mgmt_version=$MGMT_VERSION"
          } >> "$GITHUB_OUTPUT"

  # 2) Build + push only the images whose version doesn't exist yet
  build:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:${{ matrix.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) Run migrations (if API changed) then deploy changed services
  deploy:
    needs: [detect, build]
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build EF migration bundle
        if: needs.detect.outputs.api_build == 'true'
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"
          # stub appsettings.json so the design-time factory can load
          echo '{"ConnectionStrings":{"Default":"Host=localhost;Database=x;Username=x;Password=x"}}' > BarberCo.Api/appsettings.json
          dotnet ef migrations bundle \
            --project BarberCo.DataAccess \
            --startup-project BarberCo.Api \
            --configuration Release \
            --self-contained -r linux-x64 \
            -o efbundle --force

      - name: Copy bundle to server
        if: needs.detect.outputs.api_build == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: efbundle
          target: /opt/barberco

      - name: Migrate + deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: CHANGED,API_BUILD,WEB_VERSION,API_VERSION,MGMT_VERSION
          script: |
            set -e
            cd /opt/barberco
            set -a; . ./.env; set +a

            # Log in to GHCR fresh each deploy (don't rely on persisted creds)
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            update_ver() {
              if grep -q "^$1=" .env; then
                sed -i "s|^$1=.*|$1=$2|" .env
              else
                echo "$1=$2" >> .env
              fi
            }

            # Migrate BEFORE bringing up the new API
            if [ "$API_BUILD" = "true" ] && [ -f efbundle ]; then
              chmod +x efbundle
              docker run --rm --network barberco_default \
                -v /opt/barberco/efbundle:/efbundle:ro \
                mcr.microsoft.com/dotnet/runtime-deps:9.0 \
                /efbundle --connection "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
              rm -f efbundle
            fi

            for svc in $CHANGED; do
              case $svc in
                web)        update_ver WEB_VERSION "$WEB_VERSION" ;;
                api)        update_ver API_VERSION "$API_VERSION" ;;
                management) update_ver MANAGEMENT_VERSION "$MGMT_VERSION" ;;
              esac
            done

            for svc in $CHANGED; do
              docker compose pull "$svc"
              docker compose up -d "$svc"
            done

            docker image prune -f
        env:
          CHANGED: ${{ needs.detect.outputs.changed }}
          API_BUILD: ${{ needs.detect.outputs.api_build }}
          WEB_VERSION: ${{ needs.detect.outputs.web_version }}
          API_VERSION: ${{ needs.detect.outputs.api_version }}
          MGMT_VERSION: ${{ needs.detect.outputs.mgmt_version }}